services:
  jenkins:
    # This learning lab needs access to the host Docker socket; keep it bound to localhost.
    user: "0:0"
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:50000:50000"
    environment:
      JENKINS_HOME: ${PROJECT_ROOT:?set PROJECT_ROOT to the absolute repository path}/.jenkins_home
      JAVA_OPTS: -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
    volumes:
      - ${PROJECT_ROOT:?set PROJECT_ROOT to the absolute repository path}:${PROJECT_ROOT:?set PROJECT_ROOT to the absolute repository path}
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
