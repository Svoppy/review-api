<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ReviewGuard</title>
    <style>
      :root {
        --bg: linear-gradient(135deg, #fffaf1 0%, #eef6ff 100%);
        --panel: rgba(255, 255, 255, 0.86);
        --line: #d6deea;
        --text: #1f2937;
        --muted: #5f6b7a;
        --accent: #0f766e;
        --accent-2: #d97706;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Iowan Old Style", "Palatino Linotype", serif;
        color: var(--text);
        background: var(--bg);
        min-height: 100vh;
      }

      .shell {
        max-width: 920px;
        margin: 0 auto;
        padding: 48px 20px 64px;
      }

      .hero {
        margin-bottom: 28px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2.2rem, 4vw, 4rem);
        line-height: 0.95;
        letter-spacing: -0.04em;
      }

      .lead {
        max-width: 680px;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.6;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 24px;
        backdrop-filter: blur(10px);
        box-shadow: 0 18px 50px rgba(31, 41, 55, 0.08);
      }

      textarea {
        width: 100%;
        min-height: 180px;
        border-radius: 18px;
        border: 1px solid var(--line);
        padding: 18px;
        font: inherit;
        font-size: 1rem;
        resize: vertical;
        background: rgba(255, 255, 255, 0.92);
      }

      button {
        margin-top: 16px;
        border: 0;
        border-radius: 999px;
        padding: 12px 20px;
        font: inherit;
        font-weight: 700;
        color: white;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        cursor: pointer;
      }

      .status, .results {
        margin-top: 18px;
        padding: 16px 18px;
        border-radius: 18px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.75);
      }

      .results {
        display: none;
      }

      .metric {
        margin: 10px 0;
        font-size: 1rem;
      }

      .summary-grid,
      .probability-grid {
        display: grid;
        gap: 14px;
      }

      .summary-grid {
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        margin-bottom: 16px;
      }

      .probability-grid {
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      }

      .result-card {
        padding: 16px;
        border-radius: 18px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.78);
      }

      .eyebrow {
        margin: 0 0 6px;
        color: var(--muted);
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .result-value {
        margin: 0;
        font-size: 1.15rem;
        line-height: 1.4;
      }

      .pill-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 12px 0 18px;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(15, 118, 110, 0.08);
        color: var(--accent);
        font-size: 0.92rem;
      }

      .pill.warn {
        background: rgba(217, 119, 6, 0.12);
        color: #9a6700;
      }

      .probability-list {
        display: grid;
        gap: 10px;
      }

      .probability-row {
        display: grid;
        gap: 6px;
      }

      .probability-header {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 0.95rem;
      }

      .probability-track {
        overflow: hidden;
        height: 10px;
        border-radius: 999px;
        background: rgba(31, 41, 55, 0.08);
      }

      .probability-fill {
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
      }

      .notes {
        margin: 0;
        padding-left: 20px;
        color: var(--muted);
        line-height: 1.6;
      }

      .microcopy {
        margin-top: 16px;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.6;
      }

      @media (max-width: 640px) {
        .shell { padding-top: 28px; }
        .card { padding: 18px; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <p>Dissertation MVP</p>
        <h1>ReviewGuard</h1>
        <p class="lead">
          Multitask review analysis for e-commerce: one Transformer, two outputs,
          sentiment and authenticity.
        </p>
      </section>

      <section class="card">
        <label for="review">Review text</label>
        <textarea id="review" placeholder="Paste a customer review here..."></textarea>
        <button id="analyze">Analyze review</button>
        <div class="status" id="status">
          The interface is connected to the API scaffold. Predictions will work after the first trained checkpoint is exported.
        </div>
        <div class="results" id="results"></div>
      </section>
    </main>

    <script>
      const button = document.getElementById("analyze");
      const status = document.getElementById("status");
      const results = document.getElementById("results");
      const textarea = document.getElementById("review");

      const escapeHtml = (value) =>
        String(value).replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        }[char]));

      const renderProbabilityCard = (title, entries) => `
        <section class="result-card">
          <p class="eyebrow">${escapeHtml(title)}</p>
          <div class="probability-list">
            ${entries.map((entry) => `
              <div class="probability-row">
                <div class="probability-header">
                  <span>${escapeHtml(entry.label)}</span>
                  <strong>${(entry.probability * 100).toFixed(1)}%</strong>
                </div>
                <div class="probability-track">
                  <div class="probability-fill" style="width: ${(entry.probability * 100).toFixed(1)}%"></div>
                </div>
              </div>
            `).join("")}
          </div>
        </section>
      `;

      button.addEventListener("click", async () => {
        const text = textarea.value.trim();
        if (text.length < 3) {
          status.textContent = "Please enter a longer review.";
          results.style.display = "none";
          return;
        }

        status.textContent = "Sending review to API...";
        results.style.display = "none";

        try {
          const response = await fetch("/analyze", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text }),
          });

          const payload = await response.json();
          if (!response.ok) {
            status.textContent = payload.detail || "Analysis failed.";
            return;
          }

          status.textContent = "Analysis complete.";
          const explanation = payload.explanation || {};
          const research = payload.research_context || {};
          const notes = Array.isArray(explanation.notes) ? explanation.notes : [];
          const riskFlags = Array.isArray(explanation.risk_flags) ? explanation.risk_flags : [];
          const researchWarnings = Array.isArray(research.warnings) ? research.warnings : [];
          const sentimentEntries = Array.isArray(explanation.sentiment_top_probabilities)
            ? explanation.sentiment_top_probabilities
            : [];
          const authenticityEntries = Array.isArray(explanation.authenticity_top_probabilities)
            ? explanation.authenticity_top_probabilities
            : [];
          const sources = research.sources && typeof research.sources === "object"
            ? Object.entries(research.sources)
            : [];
          const robustnessSummary = research.robustness_summary && typeof research.robustness_summary === "object"
            ? research.robustness_summary
            : {};
          results.innerHTML = `
            <div class="summary-grid">
              <section class="result-card">
                <p class="eyebrow">Sentiment</p>
                <p class="result-value"><strong>${escapeHtml(payload.sentiment_label)}</strong> (${payload.sentiment_confidence.toFixed(3)})</p>
              </section>
              <section class="result-card">
                <p class="eyebrow">Authenticity</p>
                <p class="result-value"><strong>${escapeHtml(payload.authenticity_label)}</strong> (${payload.authenticity_confidence.toFixed(3)})</p>
              </section>
              <section class="result-card">
                <p class="eyebrow">Model</p>
                <p class="result-value">${escapeHtml(payload.model_name)}</p>
              </section>
            </div>
            <div class="pill-row">
              <span class="pill">Tokens scored: ${escapeHtml(explanation.token_count ?? "n/a")}</span>
              <span class="pill">Limit: ${escapeHtml(explanation.max_length ?? "n/a")}</span>
              <span class="pill">${explanation.truncated ? "Input truncated" : "Full input scored"}</span>
              <span class="pill">Sentiment margin: ${Number(explanation.sentiment_margin ?? 0).toFixed(3)}</span>
              <span class="pill">Authenticity margin: ${Number(explanation.authenticity_margin ?? 0).toFixed(3)}</span>
              ${riskFlags.map((flag) => `<span class="pill warn">${escapeHtml(flag)}</span>`).join("")}
            </div>
            <div class="probability-grid">
              ${renderProbabilityCard("Sentiment distribution", sentimentEntries)}
              ${renderProbabilityCard("Authenticity distribution", authenticityEntries)}
            </div>
            <section class="result-card" style="margin-top: 14px;">
              <p class="eyebrow">Transparent notes</p>
              <ul class="notes">
                ${notes.map((note) => `<li>${escapeHtml(note)}</li>`).join("")}
              </ul>
            </section>
            <section class="result-card" style="margin-top: 14px;">
              <p class="eyebrow">Research Context</p>
              <p class="result-value">
                Scope: <strong>${escapeHtml(research.scope ?? "unknown")}</strong><br />
                Training records: ${escapeHtml(research.training_records ?? "n/a")}<br />
                Sentiment-labeled: ${escapeHtml(research.sentiment_labeled ?? "n/a")}<br />
                Authenticity-labeled: ${escapeHtml(research.authenticity_labeled ?? "n/a")}
              </p>
              <div class="microcopy">
                Sources: ${sources.length ? sources.map(([name, count]) => `${escapeHtml(name)} (${escapeHtml(count)})`).join(", ") : "n/a"}
              </div>
              <div class="microcopy">
                Robustness proxy:
                sentiment source mean macro-F1 = ${escapeHtml(robustnessSummary.sentiment?.mean_source_macro_f1 ?? "n/a")},
                authenticity source mean macro-F1 = ${escapeHtml(robustnessSummary.authenticity?.mean_source_macro_f1 ?? "n/a")}
              </div>
              ${researchWarnings.length ? `
                <ul class="notes" style="margin-top: 10px;">
                  ${researchWarnings.map((warning) => `<li>${escapeHtml(warning)}</li>`).join("")}
                </ul>
              ` : ""}
            </section>
          `;
          results.style.display = "block";
        } catch (error) {
          status.textContent = "API is not running or not reachable yet.";
        }
      });
    </script>
  </body>
</html>
