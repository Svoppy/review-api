[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewguard"
version = "0.1.0"
description = "Multitask transformer-based system for review sentiment and authenticity analysis."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "datasets>=3.0.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "numpy>=2.0.0",
  "pandas>=2.2.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "pyyaml>=6.0.2",
  "scikit-learn>=1.5.0",
  "torch>=2.4.0",
  "transformers>=4.48.0",
  "uvicorn>=0.30.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
