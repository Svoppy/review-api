model_name: distilbert-base-multilingual-cased
max_length: 128
dropout: 0.1
sentiment_labels:
  - negative
  - neutral
  - positive
authenticity_labels:
  - authentic
  - fake
loss_weights:
  sentiment: 1.0
  authenticity: 1.0
train:
  batch_size: 8
  learning_rate: 2.0e-5
  weight_decay: 0.01
  epochs: 1
  random_state: 42
  device: cpu
  output_dir: models/experiments/pilot-multitask
  export_dir: models/pilot-latest
single_task:
  train:
    batch_size: 8
    learning_rate: 2.0e-5
    weight_decay: 0.01
    epochs: 1
    random_state: 42
    device: cpu
  tasks:
    sentiment:
      labels:
        - negative
        - neutral
        - positive
      export_dir: models/experiments/pilot-single-task-sentiment
    authenticity:
      labels:
        - authentic
        - fake
      export_dir: models/experiments/pilot-single-task-authenticity
