model_name: FacebookAI/xlm-roberta-base
max_length: 256
dropout: 0.1
sentiment_labels:
  - negative
  - neutral
  - positive
authenticity_labels:
  - authentic
  - fake
loss_weights:
  sentiment: 1.0
  authenticity: 1.0
train:
  batch_size: 8
  learning_rate: 2.0e-5
  weight_decay: 0.01
  epochs: 4
  class_weight_mode: balanced
  train_sampler: source_balanced
  early_stopping_patience: 2
  random_state: 42
  device: cpu
  output_dir: models/experiments/multitask
  export_dir: models/latest
analysis:
  robustness_slice_fields:
    - source
    - domain
    - language
  robustness_min_support: 10
single_task:
  train:
    batch_size: 8
    learning_rate: 2.0e-5
    weight_decay: 0.01
    epochs: 4
    class_weight_mode: balanced
    early_stopping_patience: 2
    random_state: 42
    device: cpu
  tasks:
    sentiment:
      labels:
        - negative
        - neutral
        - positive
      export_dir: models/experiments/single-task-sentiment
    authenticity:
      labels:
        - authentic
        - fake
      export_dir: models/experiments/single-task-authenticity
