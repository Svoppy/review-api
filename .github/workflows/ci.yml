name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[research,dev]"
      - name: Run test suite
        env:
          PYTHONPATH: src
        run: python -m pytest -q


  vercel-runtime:
    name: Vercel runtime smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install API and smoke-test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Smoke-test the lightweight Vercel entry point
        env:
          PYTHONPATH: src
          REVIEWGUARD_CHECKPOINT_DIR: ${{ runner.temp }}/reviewguard-empty-checkpoint
        run: python scripts/vercel_runtime_smoke.py

  deploy-vercel:
    name: Deploy to Vercel
    needs: [tests, vercel-runtime]
    if: github.event_name == 'push' && vars.VERCEL_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == github.event.repository.default_branch && 'production' || 'preview' }}
    concurrency:
      group: vercel-${{ github.ref_name }}
      cancel-in-progress: true
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_DEPLOY_ENV: ${{ github.ref_name == github.event.repository.default_branch && 'production' || 'preview' }}
    steps:
      - name: Check out tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install Vercel CLI
        run: npm install --global vercel@48.1.8
      - name: Validate Vercel credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_ORG_ID" || { echo "Missing VERCEL_ORG_ID repository variable"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "Missing VERCEL_PROJECT_ID repository variable"; exit 1; }
          test -n "$VERCEL_TOKEN" || { echo "Missing VERCEL_TOKEN secret for the selected GitHub environment"; exit 1; }
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment="$VERCEL_DEPLOY_ENV"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Build Vercel deployment
        run: |
          if [ "$VERCEL_DEPLOY_ENV" = "production" ]; then
            vercel build --prod
          else
            vercel build
          fi
      - name: Deploy tested build
        run: |
          if [ "$VERCEL_DEPLOY_ENV" = "production" ]; then
            vercel deploy --prebuilt --prod
          else
            vercel deploy --prebuilt
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
